<div class="workstation-bar">
  <div class="theme-control">
    <label for="theme-select">Theme</label>
    <select id="theme-select" aria-describedby="theme-feedback">
      <option value="deep-space" selected>Deep Space · Phosphor</option>
      <option value="amber">Amber · Terminal</option>
    </select>
    <label class="crt-control" for="crt-toggle">
      <input id="crt-toggle" type="checkbox" aria-describedby="theme-feedback">
      <span class="crt-switch" aria-hidden="true"></span>
      <span>CRT</span>
    </label>
    <span id="theme-feedback" class="sr-only" role="status"></span>
  </div>
</div>
