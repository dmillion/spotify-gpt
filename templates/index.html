<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Tune Raider</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
    :root { --ink:#20251f; --muted:#667069; --paper:#f3efe6; --acid:#c8e66a; --line:#d7d2c5; --red:#e3644b; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font-family:'Space Grotesk',sans-serif; }
    body:before { content:''; position:fixed; inset:0; pointer-events:none; opacity:.22; background-image:radial-gradient(#89907d 0.7px,transparent .7px); background-size:14px 14px; }
    main { width:min(1180px,calc(100% - 40px)); margin:0 auto; padding:54px 0 80px; position:relative; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:48px; }
    .eyebrow,.meta { font:500 11px 'DM Mono',monospace; letter-spacing:0; text-transform:uppercase; color:var(--muted); }
    h1 { margin:8px 0 0; font-size:clamp(42px,7vw,84px); line-height:.9; letter-spacing:-2px; max-width:700px; }
    .mark { width:80px; height:80px; background:var(--acid); border:2px solid var(--ink); display:grid; place-items:center; transform:rotate(7deg); font:500 12px 'DM Mono',monospace; text-align:center; }
    .composer { display:grid; grid-template-columns:1fr 180px; border:2px solid var(--ink); background:#fffdf8; min-height:168px; box-shadow:9px 9px 0 var(--ink); }
    textarea { width:100%; min-height:164px; padding:22px; border:0; resize:vertical; background:transparent; color:var(--ink); font:500 20px/1.35 'Space Grotesk',sans-serif; outline:none; }
    textarea::placeholder { color:#9b9d94; } button { border:0; cursor:pointer; font:600 14px 'Space Grotesk',sans-serif; }
    .generate { background:var(--red); color:#fffdf8; border-left:2px solid var(--ink); font-size:16px; padding:20px; } .generate:hover { background:#c84e37; }
    .generate:disabled { cursor:wait; opacity:.6; } .status { min-height:24px; margin:22px 0 32px; color:var(--red); font:500 12px 'DM Mono',monospace; }
    .section-head { display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:18px; }
    h2 { margin:0; font-size:24px; } .history { display:grid; gap:14px; }
    .playlist { display:grid; grid-template-columns:1fr auto; gap:18px; border-bottom:1px solid var(--line); padding:20px 0; }
    .playlist h3 { margin:0 0 7px; font-size:25px; } .playlist p { margin:0; color:var(--muted); max-width:700px; line-height:1.45; }
    .tracks { margin-top:14px; display:flex; flex-wrap:wrap; gap:6px; } .track { border:1px solid var(--line); padding:6px 9px; font:11px 'DM Mono',monospace; color:#4e5851; }
    .actions { display:flex; flex-direction:column; align-items:flex-end; gap:10px; } .date { white-space:nowrap; } .regen { background:var(--acid); color:var(--ink); padding:11px 14px; border:1px solid var(--ink); } .regen:hover { background:#b5d453; }
    a { color:var(--ink); font:500 11px 'DM Mono',monospace; text-transform:uppercase; } .empty { color:var(--muted); padding:25px 0; }
    @media (max-width:700px) { main { width:100%; max-width:100%; padding:30px 14px 56px; } header { margin-bottom:30px; } .mark { width:58px; height:58px; font-size:9px; } .composer { grid-template-columns:minmax(0,1fr); width:100%; } .generate { min-height:62px; border-left:0; border-top:2px solid var(--ink); } .playlist { grid-template-columns:minmax(0,1fr); width:100%; } .actions { flex-direction:row; align-items:center; flex-wrap:wrap; } }
    .usage { margin:0 0 32px; padding:20px; border:1px solid var(--ink); background:#fffdf8; }
    .usage h2 { font-size:18px; }
    .usage-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; margin:18px 0; }
    .usage-value { display:block; font:500 clamp(20px,3vw,32px) 'DM Mono',monospace; margin-top:7px; overflow-wrap:anywhere; }
    .usage-note { color:var(--muted); font-size:12px; line-height:1.5; margin:6px 0 0; }
    .usage-bar { display:flex; height:8px; background:var(--line); margin-bottom:12px; }
    .usage-input { background:var(--acid); } .usage-output { background:var(--red); }
    @media (max-width:700px) { .usage-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
  <script src="{{ url_for('static', filename='themes.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='themes.css') }}">
</head>
<body>
<a class="skip-link" href="#prompt">Skip to playlist prompt</a>
<main>
  {% include '_theme_picker.html' %}
  <header class="studio-header"><h1 data-glitch="Tune Raider">Tune Raider</h1></header>
  <div class="signal-panel" aria-hidden="true">
    <svg viewBox="0 0 1000 96" preserveAspectRatio="none" focusable="false">
      <defs><pattern id="signal-grid" width="40" height="24" patternUnits="userSpaceOnUse"><path d="M40 0H0V24" fill="none" stroke="currentColor" stroke-opacity=".10"/></pattern></defs>
      <rect width="1000" height="96" fill="url(#signal-grid)"/>
      <path class="signal-secondary" d="M0 65H100V32H180V72H260V22H340V45H430V15H520V63H620V30H710V78H800V40H900V60H1000"/>
      <path class="signal-primary" d="M0 48H120L130 42L140 54L150 48H245L255 32L268 67L281 20L295 76L310 38L320 48H450L460 40L472 56L485 48H565L580 22L595 74L610 12L625 85L640 30L655 55L665 48H785L795 38L805 60L815 48H1000"/>
      <path class="signal-ticks" d="M0 2H25M0 94H25M975 2H1000M975 94H1000M500 0V10M500 86V96"/>
    </svg>
  </div>
  <div class="workspace">
  <div class="compose-column">
  <section class="input-panel" aria-label="Create a playlist">
  <label class="prompt-label" for="prompt">Describe a sound, mood, or artist</label>
  <section class="composer"><textarea id="prompt" aria-describedby="prompt-help" placeholder="Pick an artist or sound and describe where you want it to go..."></textarea><button class="generate" id="generate">Generate <br>playlist</button></section>
  <p id="library-info" class="meta" aria-live="polite">Checking MP3 index…</p>
  </section>
  <div class="status" id="status" role="status"></div>
  <button type="button" id="retry-build" class="retry-build" hidden>Check / retry playlist</button>
  <p id="error-help" hidden><a id="error-help-link" target="_blank" rel="noopener noreferrer">Open OpenAI settings ↗</a></p>
  </div>
  <details class="usage">
    <summary class="usage-summary">AI usage</summary>
    <div class="usage-body">
      <div class="usage-grid">
        <div><span class="meta">Total recorded</span><strong class="usage-value" id="usage-total">—</strong></div>
        <div><span class="meta">Today (UTC)</span><strong class="usage-value" id="usage-today">—</strong></div>
        <div><span class="meta">Input tokens</span><strong class="usage-value" id="usage-input">—</strong></div>
        <div><span class="meta">Output tokens</span><strong class="usage-value" id="usage-output">—</strong></div>
      </div>
      <div class="usage-bar" aria-hidden="true"><span class="usage-input" id="usage-input-bar"></span><span class="usage-output" id="usage-output-bar"></span></div>
      <p class="usage-note" id="usage-detail" role="status">Loading usage…</p>
    </div>
  </details>
  </div>
  <section class="history-panel"><div class="section-head"><h2>Recent builds</h2><span class="meta" id="count"></span></div><div class="history" id="history"><div class="empty">No playlists yet. Give the machine a mood.</div></div></section>
</main>

      ],
      [

  }

  function buildPromptIdea(artist) {
    const genres = Array.isArray(artist.genres) ? artist.genres : [];
    const primaryGenre = sample(genres);
    const theme = genreTheme(genres);
    const scene = sample(theme.scenes);
    const quality = sample(theme.qualities);
    const constraint = sample(theme.constraints);
    return Math.random() < 0.5
      ? `Start with ${artist.name}'s ${primaryGenre} side and build toward ${scene}; ${quality}, ${constraint}...`
      : `Build a ${primaryGenre} playlist around ${artist.name}: ${quality}; ${constraint}...`;
  }

  function rotatePromptPlaceholder() {
    if (promptBox.value || !promptProfiles.length) return;
    const alternatives = promptProfiles.filter(artist => artist.name !== lastPromptArtist);
    const artist = sample(alternatives.length ? alternatives : promptProfiles);
    lastPromptArtist = artist.name;
    promptBox.placeholder = buildPromptIdea(artist);
  }

  async function loadPromptIdeas() {
    try {
      const response = await fetch('/api/prompt-profile', {cache:'no-store'});
      if (!response.ok) return;
      const profile = await response.json();
      const personalized = Array.isArray(profile.profiles)
        ? profile.profiles.filter(artist => artist?.name && Array.isArray(artist.genres) && artist.genres.length)
        : [];
      if (personalized.length) {
        promptProfiles = personalized;
        rotatePromptPlaceholder();
      }
    } catch (_) {
      // Keep the static fallback placeholder if Spotify profile data is unavailable.
    }
  }

  function render(items) {
    count.textContent = `${items.length} saved`;
    if (!items.length) { history.innerHTML = '<div class="empty">No playlists yet. Give the machine a mood.</div>'; return; }
    history.innerHTML = items.map(item => {
      const sourceLabel = item.source === 'hybrid' ? 'Hybrid / ' : item.source === 'library' ? 'MP3 library / ' : 'Discovery / ';
      return `<article class="playlist"><div><div class="eyebrow">${escapeHtml(sourceLabel)}${escapeHtml(item.prompt)}</div><h3>${escapeHtml(item.name)}</h3><p>${escapeHtml(item.description)}</p><div class="tracks">${item.tracks.slice(0,12).map(track => `<span class="track">${escapeHtml(track.artist)} / ${escapeHtml(track.title)}</span>`).join('')}${item.tracks.length > 12 ? `<span class="track">+${item.tracks.length - 12} more</span>` : ''}</div></div><div class="actions"><span class="meta date">${dateLabel(item.created_at)}</span>${item.spotify_url ? `<a href="${escapeHtml(item.spotify_url)}" target="_blank" rel="noreferrer">Open in Spotify ↗</a>` : ''}<button class="regen" data-id="${item.id}">Regenerate ↻</button></div></article>`;
    }).join('');
  }
  async function loadHistory() {
    const response = await fetch('/api/history', {cache:'no-store'});
    if (!response.ok) throw new Error(`History refresh failed (HTTP ${response.status}).`);
    render(await response.json());
  }
  async function loadUsage() {
    try {
      const response = await fetch('/api/usage', {cache:'no-store'});
      if (!response.ok) throw new Error('Could not refresh usage.');
      const data = await response.json();
      for (const [id, key] of Object.entries({total:'total_tokens', today:'today_tokens', input:'input_tokens', output:'output_tokens'})) {
        document.querySelector(`#usage-${id}`).textContent = data[key].toLocaleString();
      }
      const total = data.input_tokens + data.output_tokens;
      document.querySelector('#usage-input-bar').style.width = `${total ? data.input_tokens / total * 100 : 0}%`;
      document.querySelector('#usage-output-bar').style.width = `${total ? data.output_tokens / total * 100 : 0}%`;
      document.querySelector('#usage-detail').textContent = data.requests
        ? `${data.requests.toLocaleString()} API responses recorded · Since ${dateLabel(data.first_recorded_at)} · Latest: ${data.latest.total_tokens === null ? 'usage unavailable' : data.latest.total_tokens.toLocaleString() + ' tokens'} (${data.latest.model})${data.unreported_requests ? ` · ${data.unreported_requests} responses without token counts` : ''}`
        : 'Ready to measure your next playlist. Hybrid generation normally uses two API calls.';
    } catch (error) {
      document.querySelector('#usage-detail').textContent = 'Usage unavailable. Any displayed counts may be out of date; retrying automatically.';
    }
  }
  const retryBuild = document.querySelector('#retry-build');
  let pendingGeneration = null;
  const activeGenerationKey = 'tune-raider-active-generation';

  function generationRequestId() {
    if (window.crypto?.randomUUID) return window.crypto.randomUUID();
    return `gen-${Date.now()}-${Math.random().toString(36).slice(2,12)}`;
  }

  function stageLabel(stage) {
    return ({
      curation:'curation / candidate selection',
      spotify_auth:'Spotify authorization',
      spotify_resolution:'Spotify track resolution',
      spotify_create:'Spotify playlist creation',
      spotify_write:'writing tracks to Spotify',
      history_save:'saving Tune Raider history',
      complete:'complete',
    })[stage] || stage || 'unknown stage';
  }

  function hideRetry() {
    retryBuild.hidden = true;
    pendingGeneration = null;
  }

  function saveActiveGeneration(context) {
    try { localStorage.setItem(activeGenerationKey, JSON.stringify(context)); } catch (_) {}
  }

  function clearActiveGeneration(requestId) {
    try {
      const current = JSON.parse(localStorage.getItem(activeGenerationKey) || 'null');
      if (!requestId || current?.requestId === requestId) localStorage.removeItem(activeGenerationKey);
    } catch (_) { localStorage.removeItem(activeGenerationKey); }
  }

  function savedActiveGeneration() {
    try { return JSON.parse(localStorage.getItem(activeGenerationKey) || 'null'); }
    catch (_) { return null; }
  }

  function showRetry(context, label='Check / retry playlist') {
    pendingGeneration = context;
    retryBuild.textContent = label;
    retryBuild.hidden = false;
  }

  async function finishSuccessfulBuild(data, recovered=false, requestId=null) {
    hideRetry();
    clearActiveGeneration(requestId);
    const missing = data.missing?.length
      ? ` ${data.missing.length} unavailable on Spotify: ${data.missing.join('; ')}`
      : '';
    status.textContent = `${recovered ? 'Connection recovered. ' : ''}Spotify write confirmed: built “${data.name}” with ${data.tracks.length} tracks.${missing}`;
    promptBox.value = '';
    rotatePromptPlaceholder();

    try {
      await loadHistory();
    } catch (error) {
      status.textContent += ` Playlist creation succeeded, but the Tune Raider history refresh failed: ${error.message}`;
    }
  }

  async function generationState(requestId) {
    const response = await fetch(`/api/generation-status/${encodeURIComponent(requestId)}`, {cache:'no-store'});
    const data = await response.json().catch(() => ({}));
    if (response.status === 404) return {status:'missing', request_id:requestId};
    if (!response.ok) throw new Error(data.error || `Status check failed (HTTP ${response.status}).`);
    return data;
  }

  async function reconcileGeneration(context, attempts=180) {
    saveActiveGeneration(context);
    status.textContent = 'Playlist queued on your Tune Raider machine. The progress indicator below reports server-side work; you can leave this page.';
    window.TuneRaiderProgress?.setServerProgress('curation', 5);
    for (let attempt = 0; attempt < attempts; attempt += 1) {
      try {
        const state = await generationState(context.requestId);
        window.TuneRaiderProgress?.setServerProgress(state.stage, state.progress, state.queue_position);
        if (state.status === 'complete' && state.result) {
          await finishSuccessfulBuild(state.result, true, context.requestId);
          return true;
        }
        if (state.status === 'failed') {
          clearActiveGeneration(context.requestId);
          const where = stageLabel(state.stage);
          if (state.spotify_written) {
            status.textContent = `Spotify write succeeded, but Tune Raider failed during ${where}: ${state.error || 'unknown error'}`;
            if (state.spotify_url) status.textContent += ' The playlist should already be in Spotify.';
            return false;
          }
          if (state.spotify_created) {
            status.textContent = `Spotify created the playlist, but the build failed during ${where}: ${state.error || 'unknown error'} Do not retry automatically because a partial playlist already exists in Spotify.`;
            return false;
          }
          status.textContent = `Build failed during ${where}: ${state.error || 'unknown error'}`;
          if (state.retryable) showRetry(context, 'Retry playlist write');
          return false;
        }
        if (state.status === 'missing') {
          status.textContent = 'The server no longer has this generation request. You can retry it safely.';
          clearActiveGeneration(context.requestId);
          showRetry(context, 'Retry playlist write');
          return false;
        }
        status.textContent = state.status === 'queued'
          ? `Queued on your Tune Raider machine${state.queue_position ? ` — position ${state.queue_position}` : ''}. It will start automatically; you can leave this page.`
          : `Generating on your Tune Raider machine — ${stageLabel(state.stage)}. You can leave this page.`;
      } catch (error) {
        status.textContent = `Generation is still assigned to your Tune Raider machine, but this browser cannot currently check it: ${error.message} Reopen the app later to resume status checks.`;
        showRetry(context, 'Check playlist status');
        return false;
      }
      await new Promise(resolve => setTimeout(resolve, 2000));
    }
    status.textContent = 'Generation is still assigned to your Tune Raider machine. Reopen the app later to check the result.';
    showRetry(context, 'Check playlist status');
    return false;
  }

  async function submit(url, body, options={}) {
    if (button.disabled) return;
    document.querySelector('#error-help').hidden = true;
    hideRetry();
    button.disabled = true;
    status.textContent = 'CURATING / RESOLVING / GENERATING...';

    const isGenerate = /\/api\/generate(?:\?|$)/.test(url);
    const requestId = isGenerate ? (options.requestId || generationRequestId()) : null;
    const payload = {...body};
    if (requestId) payload.request_id = requestId;
    if (options.retry) payload.retry = true;
    const context = requestId ? {url, body:{prompt:payload.prompt}, requestId} : null;

    try {
      const response = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload),
      });
      const data = await response.json().catch(() => ({}));

      if (response.status === 202 && context) {
        saveActiveGeneration(context);
        await reconcileGeneration(context);
        return;
      }

      if (!response.ok) {
        if (response.status === 429 && data.status === 'queue_full') {
          clearActiveGeneration(requestId);
          status.textContent = data.error || 'Tune Raider generation queue is full. Try again after a current build finishes.';
          return;
        }
        if (['https://platform.openai.com/settings/organization/billing/', 'https://platform.openai.com/settings/organization/limits'].includes(data.help_url)) {
          const link = document.querySelector('#error-help-link');
          link.href = data.help_url;
          link.textContent = data.help_url.includes('/billing/') ? 'Open OpenAI API billing ↗' : 'Open OpenAI API limits ↗';
          document.querySelector('#error-help').hidden = false;
        }
        if (context && data.status === 'failed') {
          const where = stageLabel(data.stage);
          if (data.spotify_written) {
            status.textContent = `Spotify write succeeded, but Tune Raider failed during ${where}: ${data.error || 'unknown error'}`;
          } else if (data.spotify_created) {
            status.textContent = `Spotify created the playlist, but the build failed during ${where}: ${data.error || 'unknown error'} A partial playlist may exist in Spotify.`;
          } else {
            status.textContent = `Build failed during ${where}: ${data.error || 'unknown error'}`;
            if (data.retryable !== false) showRetry(context, 'Retry playlist write');
          }
          return;
        }
        throw new Error(data.error || `Request failed (HTTP ${response.status}).`);
      }

      await finishSuccessfulBuild(data, false, requestId);
    } catch (error) {
      if (context && (error instanceof TypeError || /load failed|failed to fetch|network/i.test(String(error.message)))) {
        await reconcileGeneration(context);
      } else {
        status.textContent = error.message;
      }
    } finally {
      button.disabled = false;
      try { await loadUsage(); } catch (_) {}
    }
  }

  retryBuild.addEventListener('click', async () => {
    if (!pendingGeneration) return;
    const context = pendingGeneration;
    retryBuild.hidden = true;
    await submit(context.url, context.body, {requestId:context.requestId, retry:true});
  });
  button.addEventListener('click', () => submit('/api/generate', {prompt:promptBox.value}));
  promptBox.addEventListener('keydown', event => { if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') button.click(); });
  history.addEventListener('click', event => { if (event.target.matches('.regen')) submit(`/api/history/${event.target.dataset.id}/regenerate`, {}); });
  fetch('/api/library').then(response => response.json()).then(data => {
    document.querySelector('#library-info').textContent = data.available
      ? `${data.tracks.toLocaleString()} tracks indexed · Hybrid library + discovery ready`
      : data.error;
  }).catch(() => { document.querySelector('#library-info').textContent = 'Could not check the MP3 index.'; });
  loadHistory();
  loadUsage();
  loadPromptIdeas();
  const resumedGeneration = savedActiveGeneration();
  if (resumedGeneration?.requestId && resumedGeneration?.body?.prompt) {
    pendingGeneration = resumedGeneration;
    reconcileGeneration(resumedGeneration);
  }
  setInterval(() => { if (!document.hidden) loadUsage(); }, 10000);
  setInterval(() => { if (!document.hidden) rotatePromptPlaceholder(); }, 9000);
</script>
